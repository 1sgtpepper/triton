name: Reproduce histogram narrow integer failure

on:
  workflow_dispatch:

permissions: read-all

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make dev-install
      - run: python -m pytest python/test/unit/language/test_compile_only.py -k histogram_narrow_integer

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install triton==3.7.1
      - run: cd /tmp && python "$GITHUB_WORKSPACE/.github/repro_histogram_narrow_integer.py"
