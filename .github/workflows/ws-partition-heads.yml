name: Warp partition head validation

on:
  push:
    branches:
      - validation/ws-partition-heads-2026-10-03

permissions:
  contents: read

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out Gather PR head
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: 3ccb92d230a78da486895b19321cb669e7b9a140
          submodules: true
          persist-credentials: false

      - name: Check exact revision
        run: test "$(git rev-parse HEAD)" = 3ccb92d230a78da486895b19321cb669e7b9a140

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build compiler
        env:
          MAX_JOBS: '2'
        run: make dev-install

      - name: Compile Gather reproducer
        run: python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py::test_compile_only_ws_gather_falls_back

      - name: Run Gather partition fixtures
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          cd "$build_dir"
          lit -v test/Hopper/WarpSpecialization/ws_gather_fallback.mlir test/Hopper/WarpSpecialization/ws_data_partition.mlir

      - name: Package exact-head wheel
        env:
          MAX_JOBS: '2'
        run: python3 setup.py bdist_wheel

      - name: Save wheel
        uses: actions/upload-artifact@v4
        with:
          name: gather-head-wheel
          path: dist/*.whl
          if-no-files-found: error

  atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out Atomic PR head
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: 1d86ea9ec8f4210dcebec0347cda4d1b2c950b7c
          submodules: true
          persist-credentials: false

      - name: Check exact revision
        run: test "$(git rev-parse HEAD)" = 1d86ea9ec8f4210dcebec0347cda4d1b2c950b7c

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build compiler
        env:
          MAX_JOBS: '2'
        run: make dev-install

      - name: Compile Atomic reproducer
        run: python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py::test_compile_only_ws_atomic_rmw_falls_back

      - name: Run Atomic partition fixtures
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          cd "$build_dir"
          lit -v test/Hopper/WarpSpecialization/ws_atomic_rmw_fallback.mlir test/Hopper/WarpSpecialization/ws_atomic_rmw_partition_reject.mlir

      - name: Package exact-head wheel
        env:
          MAX_JOBS: '2'
        run: python3 setup.py bdist_wheel

      - name: Save wheel
        uses: actions/upload-artifact@v4
        with:
          name: atomic-head-wheel
          path: dist/*.whl
          if-no-files-found: error
