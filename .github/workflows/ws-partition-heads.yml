name: Warp partition head validation

on:
  push:
    branches:
      - validation/warp-partition-heads-2026-10-21

  workflow_dispatch:

permissions:
  contents: read

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TRITON_BUILD_WITH_CLANG_LLD: '1'
      TRITON_BUILD_PROTON: 'OFF'
      TRITON_REL_BUILD_WITH_ASSERTS: '1'
      TRITON_APPEND_CMAKE_ARGS: '-DTRITON_BUILD_UT=ON'

    steps:
      - name: Check out Gather PR head
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: e9705bc796032c23434cd23e51f438b84065c115
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Check exact revision
        run: test "$(git rev-parse HEAD)" = e9705bc796032c23434cd23e51f438b84065c115

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check repository hooks
        run: |
          python3 -m pip install pre-commit==4.0.1
          pre-commit run --from-ref 23d6832c426e79a9b269d6252b11f17041bd35b5 --to-ref HEAD --show-diff-on-failure
          git diff --exit-code

      - name: Build compiler
        env:
          MAX_JOBS: '2'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python3 -m pip install setuptools==84.0.0 cmake==3.31.10 ninja==1.13.2 nanobind==2.10.2 wheel==0.48.0 packaging==26.3 lit pytest
          python3 -m pip install --no-build-isolation --no-deps -e . -v
          make

      - name: Compile Gather reproducer
        run: python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py::test_compile_only_ws_gather_falls_back

      - name: Run Gather partition fixtures
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          cd "$build_dir"
          lit -v test/Hopper/WarpSpecialization/ws_gather_fallback.mlir test/Hopper/WarpSpecialization/ws_gather_preexisting_ids.mlir test/Hopper/WarpSpecialization/ws_data_partition.mlir

      - name: Check optional debug output in the assertions build
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          "$build_dir/bin/triton-opt" test/Hopper/WarpSpecialization/ws_gather_fallback.mlir --nvgpu-warp-specialization=num-stages=2 --debug-only=nvgpu-ws-data-partition > /tmp/gather-debug.log 2>&1
          grep -Fq 'dim <unassigned>' /tmp/gather-debug.log
          grep -Fq '@gather_after_loop_falls_back' /tmp/gather-debug.log

      - name: Package exact-head wheel
        env:
          MAX_JOBS: '2'
        run: python3 setup.py bdist_wheel

      - name: Save wheel
        uses: actions/upload-artifact@v4
        with:
          name: gather-head-wheel
          path: dist/*.whl
          if-no-files-found: error

  atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TRITON_BUILD_WITH_CLANG_LLD: '1'
      TRITON_BUILD_PROTON: 'OFF'
      TRITON_APPEND_CMAKE_ARGS: '-DTRITON_BUILD_UT=ON'

    steps:
      - name: Check out Atomic PR head
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: cab0aff690c253634af0a7ca4dfd9eac61c57beb
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Check exact revision
        run: test "$(git rev-parse HEAD)" = cab0aff690c253634af0a7ca4dfd9eac61c57beb

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check repository hooks
        run: |
          python3 -m pip install pre-commit==4.0.1
          pre-commit run --from-ref 23d6832c426e79a9b269d6252b11f17041bd35b5 --to-ref HEAD --show-diff-on-failure
          git diff --exit-code

      - name: Build compiler
        env:
          MAX_JOBS: '2'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python3 -m pip install setuptools==84.0.0 cmake==3.31.10 ninja==1.13.2 nanobind==2.10.2 wheel==0.48.0 packaging==26.3 lit pytest
          python3 -m pip install --no-build-isolation --no-deps -e . -v
          make

      - name: Compile Atomic reproducer
        run: python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py::test_compile_only_ws_atomic_rmw_falls_back

      - name: Run Atomic partition fixtures
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          cd "$build_dir"
          lit -v test/Hopper/WarpSpecialization/ws_atomic_rmw_fallback.mlir test/Hopper/WarpSpecialization/ws_atomic_rmw_partition_reject.mlir test/Hopper/WarpSpecialization/ws_atomic_rmw_preexisting_ids.mlir

      - name: Package exact-head wheel
        env:
          MAX_JOBS: '2'
        run: python3 setup.py bdist_wheel

      - name: Save wheel
        uses: actions/upload-artifact@v4
        with:
          name: atomic-head-wheel
          path: dist/*.whl
          if-no-files-found: error
