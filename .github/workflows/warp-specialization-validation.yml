name: Warp specialization validation

on:
  push:
    branches:
      - validation/ws-partition-fallback

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install formatting checker
        run: python3 -m pip install pre-commit

      - name: Check changed files
        run: >-
          python3 -m pre_commit run --files
          third_party/nvidia/hopper/lib/Transforms/WarpSpecialization.cpp
          third_party/nvidia/hopper/lib/Transforms/WarpSpecialization/Utility.h
          third_party/nvidia/hopper/lib/Transforms/WarpSpecialization/WSDataPartition.cpp
          third_party/nvidia/hopper/lib/Transforms/WarpSpecialization/WSDataPartition.h
          third_party/nvidia/hopper/lib/Transforms/WarpSpecialization/WSTaskIdPropagate.cpp
          python/test/unit/language/test_compile_only.py

      - name: Build Triton and triton-opt
        run: |
          MAX_JOBS=2 make dev-install
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt

      - name: Run warp-specialization compile-only regressions
        run: |
          python3 -m pip install pytest
          python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py \
            -k 'test_compile_only_ws_gather_falls_back_to_one_consumer or test_compile_only_ws_unused_atomic_stays_in_each_consumer'
