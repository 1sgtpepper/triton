name: Partition patch validation

on:
  push:
    branches:
      - validation/partition-proof-2026-09-30

permissions:
  contents: read

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out patch
        uses: actions/checkout@v6
        with:
          path: harness
          sparse-checkout: validation/patches
          persist-credentials: false

      - name: Check out Gather PR revision
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: 4f12ec924a55271fdd29617c97660446c2263ef6
          path: source
          submodules: true
          fetch-depth: 100
          persist-credentials: false

      - name: Apply local candidate
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 4f12ec924a55271fdd29617c97660446c2263ef6
          git apply --check "$GITHUB_WORKSPACE/harness/validation/patches/gather.patch"
          git apply "$GITHUB_WORKSPACE/harness/validation/patches/gather.patch"
          git diff --check
          git diff --stat

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build patched compiler
        working-directory: source
        env:
          MAX_JOBS: '2'
        run: make dev-install

      - name: Compile issue reproducer
        working-directory: source
        run: python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py::test_compile_only_ws_gather_partitions_orthogonal_axis

      - name: Test Gather partition fixtures
        working-directory: source
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          cd "$build_dir"
          lit -v test/Hopper/WarpSpecialization/ws_gather_fallback.mlir
