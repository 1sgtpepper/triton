name: Partition source proof

on:
  push:
    branches:
      - validation/partition-proof-2026-09-30

permissions:
  contents: read

jobs:
  gather-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gather-base
            ref: 895801b66e43eb6784624d9e68870af3b8fd78d8
          - label: gather-head
            ref: 4f12ec924a55271fdd29617c97660446c2263ef6

    steps:
      - name: Check out proof fixture
        uses: actions/checkout@v6
        with:
          path: harness
          sparse-checkout: validation/fixtures
          persist-credentials: false

      - name: Check out source revision
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: ${{ matrix.ref }}
          path: source
          submodules: true
          fetch-depth: 100
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build exact source revision
        working-directory: source
        env:
          MAX_JOBS: '2'
        run: make dev-install

      - name: Isolate Gather fixture functions
        working-directory: source
        shell: bash
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          binary="$(find "$build_dir" -type f -name triton-opt -perm -u+x -print -quit)"
          test -n "$binary"
          fixture="$GITHUB_WORKSPACE/harness/validation/fixtures/ws_gather_full.mlir"
          printf '43a3bd9e4dd3ad92f3017294a0182648226a4be5af81e1b0e91b51a771eba111  %s\n' "$fixture" | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          python3 - "$fixture" "$binary" "$GITHUB_WORKSPACE/diagnostics" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          fixture = Path(sys.argv[1])
          binary = sys.argv[2]
          out = Path(sys.argv[3])
          lines = fixture.read_text().splitlines(keepends=True)
          starts = (153, 173, 193, 213, 234, 262, 287, 318, 352)
          ends = (172, 192, 212, 233, 261, 286, 317, 351, 370)
          header = "".join(lines[144:152])
          footer = lines[370]
          functions = ["".join(lines[start - 1:end])
                       for start, end in zip(starts, ends)]
          assert len(lines) == 371 and footer.strip() == "}"
          assert all(body.lstrip().startswith("tt.func ") for body in functions)

          cases = [("full", "".join(lines))]
          for index in range(len(functions)):
              cases.append((f"single-{index + 1}", header + functions[index] + footer))
              cases.append((f"prefix-{index + 1}", header + "".join(functions[:index + 1]) + footer))
          for index in range(8):
              cases.append((f"pair-{index + 1}-9", header + functions[index] + functions[8] + footer))

          statuses = {}
          for label, body in cases:
              path = out / f"{label}.mlir"
              path.write_text(body)
              result = subprocess.run(
                  [binary, str(path), "--nvgpu-warp-specialization=num-stages=2", "-o", "/dev/null"],
                  capture_output=True, text=True, errors="replace")
              (out / f"{label}.log").write_text(result.stdout + result.stderr)
              statuses[label] = result.returncode
              print(f"{label}: {result.returncode}", flush=True)

          failing = [label for label, code in statuses.items() if code != 0]
          for label in dict.fromkeys(["full"] + failing[:2]):
              path = out / f"{label}.mlir"
              result = subprocess.run(
                  [binary, str(path), "--nvgpu-warp-specialization=num-stages=2 dump-intermediate-steps=true",
                   "-o", "/dev/null"],
                  capture_output=True, text=True, errors="replace")
              (out / f"{label}-stages.log").write_text(result.stdout + result.stderr)
              statuses[f"{label}-stages"] = result.returncode
              print(f"{label}-stages: {result.returncode}", flush=True)

          (out / "status.txt").write_text(
              "".join(f"{label}={code}\n" for label, code in statuses.items()))
          PY

      - name: Save proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gather-fixture-${{ matrix.label }}
          path: diagnostics/
          if-no-files-found: warn
