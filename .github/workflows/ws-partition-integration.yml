name: Warp partition integration validation

on:
  push:
    branches:
      - validation/warp-partition-integration-ci-2026-10-21

  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TRITON_BUILD_WITH_CLANG_LLD: '1'
      TRITON_BUILD_PROTON: 'OFF'
      TRITON_APPEND_CMAKE_ARGS: '-DTRITON_BUILD_UT=ON'

    steps:
      - name: Check out integrated revision
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/triton
          ref: 63337172e96e6e517d9161d45194ca8b70899e9d
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Check exact revision
        run: test "$(git rev-parse HEAD)" = 63337172e96e6e517d9161d45194ca8b70899e9d

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check repository hooks
        run: |
          python3 -m pip install pre-commit==4.0.1
          pre-commit run --from-ref 23d6832c426e79a9b269d6252b11f17041bd35b5 --to-ref HEAD --show-diff-on-failure
          git diff --exit-code

      - name: Build compiler
        env:
          MAX_JOBS: '2'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python3 -m pip install setuptools==84.0.0 cmake==3.31.10 ninja==1.13.2 nanobind==2.10.2 wheel==0.48.0 packaging==26.3 lit pytest
          python3 -m pip install --no-build-isolation --no-deps -e . -v
          make

      - name: Compile both reproducers
        run: python3 -m pytest -s --tb=short python/test/unit/language/test_compile_only.py::test_compile_only_ws_gather_falls_back python/test/unit/language/test_compile_only.py::test_compile_only_ws_atomic_rmw_falls_back

      - name: Run Hopper warp partition fixtures
        run: |
          build_dir="$(PYTHONPATH=python python3 -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')"
          ninja -C "$build_dir" triton-opt
          cd "$build_dir"
          lit -v test/Hopper/WarpSpecialization

      - name: Package exact-head wheel
        env:
          MAX_JOBS: '2'
        run: python3 setup.py bdist_wheel

      - name: Save wheel
        uses: actions/upload-artifact@v4
        with:
          name: integration-head-wheel
          path: dist/*.whl
          if-no-files-found: error
