name: Validate tensor-memory fixes

on:
  push:
    branches: [repro/tmem-scale-views-and-lifetimes]
    paths: [.github/workflows/fix-candidates.yml]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAX_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      TRITON_BUILD_WITH_CLANG_LLD: "1"
      TRITON_BUILD_PROTON: "OFF"
      TRITON_APPEND_CMAKE_ARGS: "-DTRITON_BUILD_UT=ON -DLLVM_LIT_ARGS=-j2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aea30498dc77c5fd6c01b7ef4bb7309f3fdc1ccc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.triton
            wheelhouse
          key: tmem-compiler-Linux-X64-cp312-8d60dada1a7097db9db86e2af0fc6047bfe44a17de7f35a1fc8b2eae831cf73a
          fail-on-cache-miss: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Check exact revision and repository hooks
        run: |
          test "$(git rev-parse HEAD)" = "aea30498dc77c5fd6c01b7ef4bb7309f3fdc1ccc"
          git fetch --no-tags --depth=1 origin 1665fa9a96713f0157e5436f247369d83d0a6632
          python -m pip install pre-commit
          mapfile -t changed < <(git diff --name-only 1665fa9a96713f0157e5436f247369d83d0a6632 HEAD)
          pre-commit run --show-diff-on-failure --verbose --files "${changed[@]}"
      - name: Install compiler build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python -m pip install setuptools==84.0.0 cmake==3.31.10 ninja==1.13.2 nanobind==2.10.2 wheel==0.48.0 packaging==26.3 lit pytest
      - name: Build and check the final source
        run: |
          git rev-parse HEAD
          python -m pip install --no-build-isolation --no-deps -e . -v
          make
          build_dir=$(PYTHONPATH=./python python -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')
          ninja -C "$build_dir" -j2 check-triton-lit-tests check-triton-unit-tests
          git diff --exit-code
      - name: Verify each new regression detects the original lifetime bug
        run: |
          source_file=lib/Dialect/TritonNvidiaGPU/Transforms/TensorMemoryAllocation.cpp
          git show 1665fa9a96713f0157e5436f247369d83d0a6632:"$source_file" > "$source_file"
          build_dir=$(PYTHONPATH=./python python -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')
          ninja -C "$build_dir" -j2 triton-opt
          export REVIEW_BUILD_DIR="$build_dir"
          python - <<'PYCODE'
          import os, pathlib, subprocess, tempfile
          build = pathlib.Path(os.environ["REVIEW_BUILD_DIR"])
          opt = build / "bin/triton-opt"
          checkers = list(pathlib.Path.home().glob(".triton/llvm/**/bin/FileCheck"))
          assert len(checkers) == 1, checkers
          text = pathlib.Path("test/TritonNvidiaGPU/test_tensor_memory_allocation.mlir").read_text()
          names = ["tmem_select_extends_liveness", "tmem_view_select_extends_liveness", "tmem_select_view_extends_liveness", "tmem_chain_extends_liveness"]
          with tempfile.TemporaryDirectory() as directory:
              for name in names:
                  parts = [part for part in text.split("// -----") if "@" + name + "(" in part]
                  assert len(parts) == 1
                  fixture = pathlib.Path(directory) / (name + ".mlir")
                  fixture.write_text(parts[0])
                  result = subprocess.run([str(opt), str(fixture), "-allow-unregistered-dialect", "-triton-tensor-memory-allocation"], text=True, capture_output=True, check=True)
                  checked = subprocess.run([str(checkers[0]), str(fixture)], input=result.stdout, text=True, capture_output=True)
                  assert checked.returncode == 1, (name, checked.returncode, checked.stderr)
                  assert "expected string not found" in checked.stderr, checked.stderr
                  print(name + ": original source fails allocation checks as expected")
                  print(checked.stderr)
          PYCODE
          git restore "$source_file"
          git diff --exit-code
