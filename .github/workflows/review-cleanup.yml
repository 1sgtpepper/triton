name: Validate scale regression cleanup
on:
  push:
    branches: [validation/tmem-review-cleanup-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAX_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      TRITON_BUILD_WITH_CLANG_LLD: "1"
      TRITON_BUILD_PROTON: "OFF"
      TRITON_APPEND_CMAKE_ARGS: "-DTRITON_BUILD_UT=ON -DLLVM_LIT_ARGS=-j2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: b45c9f2bb2fedaabee1e0ae6c09aa53725fdb992
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ hashFiles('source/.pre-commit-config.yaml') }}
      - name: Check complete PR hooks
        working-directory: source
        run: |
          git fetch --no-tags --depth=1 origin 43f6091b348e3314b50fd0b47f2e5a9fb9b24d5e
          python -m pip install pre-commit
          mapfile -t changed < <(git diff --name-only 43f6091b348e3314b50fd0b47f2e5a9fb9b24d5e HEAD)
          pre-commit run --show-diff-on-failure --files "${changed[@]}"
      - name: Build current compiler and run repository tests
        working-directory: source
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python -m pip install setuptools==84.0.0 cmake==3.31.10 ninja==1.13.2 nanobind==2.10.2 wheel==0.48.0 packaging==26.3 lit pytest
          python -m pip install --no-build-isolation --no-deps -e . -v
          make
          build_dir=$(PYTHONPATH=./python python -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')
          ninja -C "$build_dir" -j2 check-triton-lit-tests check-triton-unit-tests
      - name: Compile exact regression without a GPU
        working-directory: source
        run: |
          python ../harness/.github/compile_scale_review.py fixed
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: scale-checks-fixed
          path: source/evidence
          retention-days: 3
          if-no-files-found: error
  lifetime-comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d44ca489ddd9268fc6a8e8036a967ce469732fb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --files lib/Dialect/TritonNvidiaGPU/Transforms/TensorMemoryAllocation.cpp
          git diff --exit-code
