name: Check accumulator regression hooks
on:
  push:
    branches: [repro/scaled-mma-loop]
    paths: [.github/workflows/scaled-mma-hooks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 31725112a83806247f942b6b26b3a6571634c92b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --files test/TritonGPU/accumulator-init.mlir
          git diff --exit-code
